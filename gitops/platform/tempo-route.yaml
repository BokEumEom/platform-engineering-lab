apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-agent
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: http
  hostnames:
    - tempo.lab.local
  rules:
    - backendRefs:
        - name: tempo
          port: 3200
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: https
  hostnames:
    - tempo.lab.local
  rules:
    - backendRefs:
        - name: tempo
          port: 3200
