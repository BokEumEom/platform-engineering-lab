apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-agent
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: http
  hostnames:
    - loki.lab.local
  rules:
    - backendRefs:
        - name: loki-gateway
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: https
  hostnames:
    - loki.lab.local
  rules:
    - backendRefs:
        - name: loki-gateway
          port: 80
