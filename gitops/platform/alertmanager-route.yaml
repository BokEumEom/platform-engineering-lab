apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: https
  hostnames:
    - alertmanager.lab.local
  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-alertmanager
          port: 9093
