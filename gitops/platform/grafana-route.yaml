apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-redirect
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: http
  hostnames:
    - grafana.lab.local
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: https
  hostnames:
    - grafana.lab.local
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
