apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo-app
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: platform-demo
    app.kubernetes.io/component: gateway
spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: platform-demo
        app.kubernetes.io/component: gateway

    spec:
      serviceAccountName: web
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web

      containers:
        - name: api
          image: ghcr.io/bokeumeom/platform-api:0655417e0143c853d75672b9d03e8421ca06e6db
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8000
              name: http

          env:
            - name: APP_VERSION
              value: "0655417"
            - name: SERVICE_ROLE
              value: "gateway"
            - name: CATALOG_URL
              value: "http://catalog.demo-app.svc.cluster.local"
            - name: ORDERS_URL
              value: "http://orders.demo-app.svc.cluster.local"
            - name: RECOMMENDATIONS_URL
              value: "http://recommendations.demo-app.svc.cluster.local"
            - name: DOWNSTREAM_TIMEOUT_SECONDS
              value: "2.0"
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE_PERCENT
              value: "0"
            - name: OTEL_SERVICE_NAME
              value: "platform-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
