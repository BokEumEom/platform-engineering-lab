apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-http-redirect
  namespace: demo-app
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: http

  hostnames:
    - web.lab.local

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
