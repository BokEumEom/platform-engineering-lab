apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: demo-app
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo-app
  labels:
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/part-of: platform-demo
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/name: payments-service
        app.kubernetes.io/part-of: platform-demo
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: payments
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: payments
      containers:
        - name: api
          image: ghcr.io/bokeumeom/platform-api:578285b90485a9b7fa815c0a527c2226eb9ab9e1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: "578285b"
            - name: SERVICE_ROLE
              value: "payments"
            - name: FAULT_LATENCY_MS
              value: "0"
            - name: FAULT_ERROR_RATE_PERCENT
              value: "0"
            - name: OTEL_SERVICE_NAME
              value: "payments-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: demo-app
  labels:
    app: payments
    app.kubernetes.io/name: payments-service
    app.kubernetes.io/part-of: platform-demo
    observability: platform-demo
    platform_service: payments-service
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payments
  namespace: demo-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payments
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments
  namespace: demo-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: payments
