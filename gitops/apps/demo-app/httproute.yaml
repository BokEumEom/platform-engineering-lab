apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: demo-app
spec:
  parentRefs:
    - name: platform-gateway
      namespace: platform-system
      sectionName: http

  hostnames:
    - web.lab.local

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: web
          port: 80
