apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/BokEumEom/platform-engineering-lab.git
    targetRevision: main
    path: gitops/platform

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
