name: API CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yaml"

  workflow_dispatch:

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bokeumeom/platform-api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The workflow writes a deployment commit back to main. Other documentation
      # or manifest commits may land while the image is building, so update the
      # local branch before editing the GitOps manifest.
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Update GitOps manifest
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/apps/demo-app/deployment.yaml")
          text = path.read_text()

          sha = os.environ["GITHUB_SHA"]
          image = f"{os.environ['IMAGE_NAME']}:{sha}"
          short_sha = sha[:7]

          text, image_count = re.subn(
              r"(?m)^(\s*image:\s*).+$",
              rf"\g<1>{image}",
              text,
              count=1,
          )
          text, version_count = re.subn(
              r'(?ms)(- name: APP_VERSION\s*\n\s*value:\s*")[^"]*(")',
              rf"\g<1>{short_sha}\g<2>",
              text,
              count=1,
          )

          if image_count != 1:
              raise SystemExit("expected exactly one container image field")
          if version_count != 1:
              raise SystemExit("expected exactly one APP_VERSION field")

          path.write_text(text)
          PY

      - name: Commit GitOps update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/demo-app/deployment.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: deploy platform-api ${GITHUB_SHA::7}"

          # Retry a few times if main advances again in the short window between
          # rebase and push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push attempt ${attempt} failed; rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
            sleep 2
          done

          echo "failed to push GitOps manifest after retries"
          exit 1
