name: API CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ci.yaml"

  workflow_dispatch:

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/bokeumeom/platform-api

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Update all GitOps workloads
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          files = [
              Path("gitops/apps/demo-app/deployment.yaml"),
              Path("gitops/apps/demo-app/catalog.yaml"),
              Path("gitops/apps/demo-app/orders.yaml"),
              Path("gitops/apps/demo-app/inventory.yaml"),
              Path("gitops/apps/demo-app/payments.yaml"),
              Path("gitops/apps/demo-app/recommendations.yaml"),
          ]

          sha = os.environ["GITHUB_SHA"]
          image = f"{os.environ['IMAGE_NAME']}:{sha}"
          short_sha = sha[:7]

          for path in files:
              text = path.read_text()
              text, image_count = re.subn(
                  r"(?m)^(\s*image:\s*)ghcr\.io/bokeumeom/platform-api:[^\s]+$",
                  rf"\g<1>{image}",
                  text,
              )
              text, version_count = re.subn(
                  r'(?ms)(- name: APP_VERSION\s*\n\s*value:\s*")[^"]*(")',
                  rf"\g<1>{short_sha}\g<2>",
                  text,
              )

              if image_count != 1:
                  raise SystemExit(f"{path}: expected exactly one platform-api image, got {image_count}")
              if version_count != 1:
                  raise SystemExit(f"{path}: expected exactly one APP_VERSION, got {version_count}")

              path.write_text(text)
          PY

      - name: Commit GitOps update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            gitops/apps/demo-app/deployment.yaml \
            gitops/apps/demo-app/catalog.yaml \
            gitops/apps/demo-app/orders.yaml \
            gitops/apps/demo-app/inventory.yaml \
            gitops/apps/demo-app/payments.yaml \
            gitops/apps/demo-app/recommendations.yaml

          git diff --cached --quiet && exit 0

          git commit -m "chore: deploy platform services ${GITHUB_SHA::7}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push attempt ${attempt} failed; rebasing onto latest main"
            git fetch origin main
            git rebase origin/main
            sleep 2
          done

          echo "failed to push GitOps manifests after retries"
          exit 1
