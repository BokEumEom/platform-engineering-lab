name: Platform Validate

on:
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "observability/**"
      - "platform/**"
      - "argocd/**"
      - "ops/**"
      - "docs/13-ops-agent-runbook.md"
      - "docs/14-operational-observability.md"
      - ".github/workflows/platform-validate.yaml"
  pull_request:
    paths:
      - "gitops/**"
      - "observability/**"
      - "platform/**"
      - "argocd/**"
      - "ops/**"
      - ".github/workflows/platform-validate.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML and Grafana dashboard JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          roots = [Path("gitops"), Path("observability"), Path("platform"), Path("argocd")]
          count = 0
          dashboards = 0
          for root in roots:
              for path in root.rglob("*.yaml"):
                  docs = list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  count += 1
                  for doc in docs:
                      if not isinstance(doc, dict):
                          continue
                      metadata = doc.get("metadata") or {}
                      labels = metadata.get("labels") or {}
                      if doc.get("kind") == "ConfigMap" and labels.get("grafana_dashboard") == "1":
                          for key, value in (doc.get("data") or {}).items():
                              if key.endswith(".json"):
                                  json.loads(value)
                                  dashboards += 1
          print(f"validated YAML files: {count}")
          print(f"validated Grafana dashboard JSON documents: {dashboards}")
          PY

      - name: Guard zero-error SLI materialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          doc = yaml.safe_load(Path("observability/platform-slo-rules.yaml").read_text(encoding="utf-8"))
          rules = {}
          for group in doc["spec"]["groups"]:
              for rule in group.get("rules", []):
                  if "record" in rule:
                      rules[rule["record"]] = str(rule.get("expr", ""))

          required = [
              "platform:http_error_ratio:5m",
              "platform:http_error_ratio:30m",
              "platform:http_error_ratio:1h",
              "platform:http_error_ratio:6h",
          ]
          for name in required:
              expr = rules.get(name, "")
              if " or\n" not in expr and "\nor\n" not in expr:
                  raise SystemExit(f"{name} must zero-fill the no-5xx case with an OR expression")
              if "0 * sum by (platform_service)" not in expr:
                  raise SystemExit(f"{name} must materialize zero from the request-rate label set")
          print("zero-error SLI materialization guard passed")
          PY

      - name: Render application GitOps
        run: kubectl kustomize gitops/apps/demo-app >/tmp/demo-app.yaml

      - name: Render platform GitOps
        run: kubectl kustomize gitops/platform >/tmp/platform.yaml

      - name: Render observability GitOps
        run: kubectl kustomize observability >/tmp/observability.yaml

      - name: Validate Ops benchmark shell
        run: bash -n ops/benchmarks/orders-fault/run.sh

      - name: Guard healthy default fault profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path("gitops/apps/demo-app/orders.yaml").read_text(encoding="utf-8")
          for name in ("FAULT_LATENCY_MS", "FAULT_ERROR_RATE_PERCENT"):
              match = re.search(rf'(?ms)- name: {name}\s*\n\s*value:\s*"([^"]*)"', text)
              if not match:
                  raise SystemExit(f"missing {name} in orders manifest")
              if match.group(1) != "0":
                  raise SystemExit(f"main must remain healthy: {name}={match.group(1)}")
          print("orders fault profile defaults are healthy")
          PY

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Render kube-prometheus-stack
        run: |
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --version 90.0.0 \
            --namespace monitoring \
            -f observability/kube-prometheus-stack-values.yaml \
            >/tmp/kube-prometheus-stack.yaml

      - name: Render Loki
        run: |
          helm template loki grafana-community/loki \
            --version 18.12.1 \
            --namespace monitoring \
            -f observability/loki-values.yaml \
            >/tmp/loki.yaml

      - name: Render Alloy
        run: |
          helm template alloy grafana/alloy \
            --version 1.12.1 \
            --namespace monitoring \
            -f observability/alloy-values.yaml \
            >/tmp/alloy.yaml

      - name: Validate Prometheus query profile JSON
        run: python -m json.tool observability/agent-prometheus-queries.json >/dev/null
