apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-operations-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  storage-operations.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Bound PVCs",
          "gridPos": {"h": 5, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"decimals": 0}},
          "targets": [{"refId": "A", "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=\"Bound\"} == 1)"}]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pending PVCs",
          "gridPos": {"h": 5, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"decimals": 0}},
          "targets": [{"refId": "A", "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=\"Pending\"} == 1) or vector(0)"}]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Storage Requested",
          "gridPos": {"h": 5, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"refId": "A", "expr": "sum(kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\"}) or vector(0)"}]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "PVC Usage Metric Sources",
          "description": "CSI/kubelet volume stats are preferred. storage-probe is a deterministic local-lab fallback when the storage driver exposes no kubelet_volume_stats_* series.",
          "gridPos": {"h": 5, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"decimals": 0}},
          "targets": [
            {"refId": "A", "expr": "count(kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\"}) or vector(0)", "legendFormat": "CSI/kubelet"},
            {"refId": "B", "expr": "count(storage_probe_usage_ratio{namespace=~\"$namespace\"}) or vector(0)", "legendFormat": "storage-probe fallback"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "PVC Usage Ratio · CSI preferred",
          "description": "Uses kubelet/CSI volume stats when present, otherwise storage_probe_usage_ratio for the local reference environment.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"refId": "A", "expr": "max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace=~\"$namespace\"} / clamp_min(kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\"}, 1)) or max by (namespace, persistentvolumeclaim) (storage_probe_usage_ratio{namespace=~\"$namespace\"})", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"}]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "PVC Used / Available Bytes · CSI preferred",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}},
          "targets": [
            {"refId": "A", "expr": "max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace=~\"$namespace\"}) or max by (namespace, persistentvolumeclaim) (storage_probe_fill_bytes{namespace=~\"$namespace\"})", "legendFormat": "{{persistentvolumeclaim}} used"},
            {"refId": "B", "expr": "max by (namespace, persistentvolumeclaim) (kubelet_volume_stats_available_bytes{namespace=~\"$namespace\"}) or max by (namespace, persistentvolumeclaim) (clamp_min(storage_probe_requested_capacity_bytes{namespace=~\"$namespace\"} - storage_probe_fill_bytes{namespace=~\"$namespace\"}, 0))", "legendFormat": "{{persistentvolumeclaim}} available"}
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "PVC Inode Usage · CSI only",
          "description": "No synthetic inode fallback is generated. An empty panel means the current storage driver does not expose kubelet volume inode statistics.",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}},
          "targets": [{"refId": "A", "expr": "kubelet_volume_stats_inodes_used{namespace=~\"$namespace\"} / clamp_min(kubelet_volume_stats_inodes{namespace=~\"$namespace\"}, 1)", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"}]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "PVC Requested Capacity",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "fieldConfig": {"defaults": {"unit": "bytes", "min": 0}},
          "targets": [{"refId": "A", "expr": "kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\"}", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}"}]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["kubernetes", "storage", "pvc", "operations"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": {"query": "label_values(kube_persistentvolumeclaim_info, namespace)", "refId": "namespace-variable"},
            "current": {"text": "demo-app", "value": "demo-app"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1
          },
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1
          }
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Kubernetes Operations · Storage & PVC",
      "uid": "kubernetes-storage-pvc",
      "version": 2
    }
