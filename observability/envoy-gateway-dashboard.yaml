apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-gateway-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  envoy-gateway.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(envoy_http_downstream_rq_total[5m]))",
              "legendFormat": "Envoy Gateway",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=\"demo-app\"}[5m]))",
              "legendFormat": "FastAPI",
              "refId": "B"
            }
          ],
          "title": "Request Rate — Gateway vs Application",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"unit": "s", "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(envoy_http_downstream_rq_time_bucket[5m]))) / 1000",
              "legendFormat": "Envoy P95",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"demo-app\"}[5m])))",
              "legendFormat": "FastAPI P95",
              "refId": "B"
            }
          ],
          "title": "P95 Latency — Gateway vs Application",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"unit": "reqps", "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}},
          "targets": [
            {
              "expr": "sum(rate(envoy_http_downstream_rq_5xx[5m]))",
              "legendFormat": "Envoy 5xx/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=\"demo-app\",status=~\"5..\"}[5m]))",
              "legendFormat": "FastAPI 5xx/s",
              "refId": "B"
            }
          ],
          "title": "5xx Rate — Gateway vs Application",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(envoy_http_downstream_rq_active)",
              "legendFormat": "Active requests",
              "refId": "A"
            }
          ],
          "title": "Envoy Active Requests",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"min": 0, "decimals": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(envoy_server_live)",
              "legendFormat": "Live Envoy proxies",
              "refId": "A"
            }
          ],
          "title": "Envoy Live Proxies",
          "type": "stat"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": ["platform-engineering-lab", "envoy-gateway"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "name": "DS_PROMETHEUS",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {"from": "now-30m", "to": "now"},
      "timezone": "browser",
      "title": "Platform Lab - Envoy Gateway",
      "uid": "platform-lab-envoy-gateway",
      "version": 1
    }
