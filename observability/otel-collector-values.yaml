# Lightweight OpenTelemetry Collector for the local kind lab.
# Chart: open-telemetry/opentelemetry-collector 0.172.1
# App: OpenTelemetry Collector 0.159.0

mode: deployment
fullnameOverride: otel-collector
replicaCount: 1

# The chart requires an explicit Collector image repository.
# Use the official Kubernetes distribution from GHCR.
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s

# The Kubernetes distribution binary is named otelcol-k8s.
command:
  name: otelcol-k8s

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

ports:
  otlp:
    enabled: true
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true

config:
  exporters:
    debug:
      verbosity: detailed
    otlp_grpc/tempo:
      endpoint: tempo.monitoring.svc.cluster.local:4317
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - debug
          - otlp_grpc/tempo

serviceMonitor:
  enabled: true
