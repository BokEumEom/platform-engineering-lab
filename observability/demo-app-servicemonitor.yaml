apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-app
  namespace: demo-app
  labels:
    app.kubernetes.io/part-of: platform-demo
spec:
  selector:
    matchLabels:
      observability: platform-demo
  jobLabel: platform_service
  targetLabels:
    - platform_service
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
